[package]
name = "solverforge-ev"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Electric-van delivery routing with charging stops, built with SolverForge"
license = "Apache-2.0"

[[bin]]
name = "solverforge_ev"
path = "src/main.rs"

[dependencies]
solverforge = { version = "0.31.2", features = ["serde", "console", "verbose-logging"] }
solverforge-ui = { version = "0.9.1" }
solverforge-maps = { version = "2.3.3" }
# Web server
axum = "0.8.9"
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
tower-http = { version = "0.6.11", features = ["fs", "cors"] }
tower = "0.5.3"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
schemars = { version = "1.0", optional = true }

# Utilities
parking_lot = "0.12.5"

[features]
# Typed JSON Schemas for the shared DTO contract (required by the MCP shell).
schema = ["dep:schemars"]
