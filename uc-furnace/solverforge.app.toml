[app]
name = "SolverForge Furnace"
starter = "neutral-shell"
cli_version = "2.2.2"
shell = "web"

[runtime]
target = "solverforge 0.19.4"
runtime_source = "crates.io: solverforge 0.19.4"
ui_source = "crates.io: solverforge-ui 0.6.5"

[demo]
default_size = "STANDARD"
available_sizes = [
    "STANDARD",
]

[solution]
name = "Plan"
score = "HardSoftScore"

[[facts]]
name = "furnace"
plural = "furnaces"
kind = "problem_fact"

[[facts]]
name = "work_order"
plural = "work_orders"
kind = "problem_fact"

[[facts]]
name = "operator"
plural = "operators"
kind = "problem_fact"

[[facts]]
name = "shift"
plural = "shifts"
kind = "problem_fact"

[[facts]]
name = "shift_coverage_demand"
plural = "shift_coverage_demands"
kind = "problem_fact"

[[entities]]
name = "furnace_assignment"
plural = "assignments"
kind = "planning_entity"

[[entities]]
name = "operator_shift_assignment"
plural = "operator_shift_assignments"
kind = "planning_entity"

[[variables]]
entity = "furnace_assignment"
entity_plural = "assignments"
field = "assignment"
kind = "scalar"
range = "compatible_assignments"
elements = ""
allows_unassigned = true
enabled = true

[[variables]]
entity = "furnace_assignment"
entity_plural = "assignments"
field = "load_build_operator_id"
kind = "scalar"
range = "eligible_load_build_operator_ids"
elements = ""
allows_unassigned = true
enabled = true

[[variables]]
entity = "furnace_assignment"
entity_plural = "assignments"
field = "program_operator_id"
kind = "scalar"
range = "eligible_program_operator_ids"
elements = ""
allows_unassigned = true
enabled = true

[[variables]]
entity = "furnace_assignment"
entity_plural = "assignments"
field = "quench_operator_id"
kind = "scalar"
range = "eligible_quench_operator_ids"
elements = ""
allows_unassigned = true
enabled = true

[[variables]]
entity = "furnace_assignment"
entity_plural = "assignments"
field = "unload_operator_id"
kind = "scalar"
range = "eligible_unload_operator_ids"
elements = ""
allows_unassigned = true
enabled = true

[[variables]]
entity = "operator_shift_assignment"
entity_plural = "operator_shift_assignments"
field = "shift_type"
kind = "scalar"
range = "allowed_shift_types"
elements = ""
allows_unassigned = true
enabled = true

