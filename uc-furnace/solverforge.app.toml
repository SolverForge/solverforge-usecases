[app]
name = "SolverForge Furnace"
starter = "neutral-shell"
shell = "web"
cli_version = "2.2.2"

[runtime]
target = "solverforge 0.26.1"
runtime_source = "crates.io: solverforge 0.26.1"
ui_source = "crates.io: solverforge-ui 0.9.0"

[demo]
default_size = "STANDARD"
available_sizes = ["STANDARD"]

[solution]
name = "Plan"
score = "HardSoftScore"
scalar_groups_path = "scalar_groups"
conflict_repairs_path = "conflict_repairs"

[[facts]]
name = "furnace"
plural = "furnaces"
kind = "problem_fact"

[[facts]]
name = "work_order"
plural = "work_orders"
kind = "problem_fact"

[[facts]]
name = "operator"
plural = "operators"
kind = "problem_fact"

[[facts]]
name = "shift"
plural = "shifts"
kind = "problem_fact"

[[facts]]
name = "shift_coverage_demand"
plural = "shift_coverage_demands"
kind = "problem_fact"

[[entities]]
name = "furnace_assignment"
plural = "assignments"
kind = "planning_entity"

[[entities]]
name = "operator_shift_assignment"
plural = "operator_shift_assignments"
kind = "planning_entity"

[[variables]]
entity = "furnace_assignment"
entity_plural = "assignments"
field = "assignment"
kind = "scalar"
range = "compatible_assignments"
elements = ""
allows_unassigned = true
construction_entity_order_key = "furnace_assignment_construction_entity_order_key"
construction_value_order_key = "furnace_assignment_construction_value_order_key"
enabled = true

