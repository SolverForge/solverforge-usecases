# Search policy for SolverForge EV. Embedded by `Plan` at compile time.
#
# Construction uses SolverForge's stock Clarke-Wright and 2-opt route builders.
# They call this app's battery-aware hooks (`ev_savings_hooks`, `ev_route_hooks`)
# so they only build routes a van can drive once charging stops are placed.
# Local search then moves customers between and within routes; charging stops
# follow every move because the route shadows re-place them.

environment_mode = "reproducible"
random_seed = 42

[termination]
seconds_spent_limit = 30

[[phases]]
type = "construction_heuristic"
construction_heuristic_type = "list_clarke_wright"
entity_class = "Vehicle"
variable_name = "visit_order"

[[phases]]
type = "construction_heuristic"
construction_heuristic_type = "list_k_opt"
k = 2
entity_class = "Vehicle"
variable_name = "visit_order"

[[phases]]
type = "local_search"

[phases.acceptor]
type = "late_acceptance"
late_acceptance_size = 200

[phases.forager]
type = "first_last_step_score_improving"

[phases.move_selector]
type = "union_move_selector"

[[phases.move_selector.selectors]]
type = "nearby_list_change_move_selector"
max_nearby = 20
entity_class = "Vehicle"
variable_name = "visit_order"

[[phases.move_selector.selectors]]
type = "nearby_list_swap_move_selector"
max_nearby = 20
entity_class = "Vehicle"
variable_name = "visit_order"

[[phases.move_selector.selectors]]
type = "list_reverse_move_selector"
entity_class = "Vehicle"
variable_name = "visit_order"

[[phases.move_selector.selectors]]
type = "k_opt_move_selector"
k = 3
min_segment_len = 1
max_nearby = 10
entity_class = "Vehicle"
variable_name = "visit_order"

[[phases.move_selector.selectors]]
type = "list_ruin_move_selector"
min_ruin_count = 2
max_ruin_count = 5
moves_per_step = 10
entity_class = "Vehicle"
variable_name = "visit_order"

[[phases.move_selector.selectors]]
type = "limited_neighborhood"
selected_count_limit = 500

[phases.move_selector.selectors.selector]
type = "sublist_change_move_selector"
min_sublist_size = 1
max_sublist_size = 3
entity_class = "Vehicle"
variable_name = "visit_order"
