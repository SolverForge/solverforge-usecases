[package]
name = "solverforge-fleet"
version = "0.1.1"
edition = "2021"
rust-version = "1.95"
description = "SolverForge fleet readiness planning example"
publish = false

[[bin]]
name = "solverforge-fleet"
path = "src/main.rs"

[dependencies]
solverforge = { version = "0.19.4", features = ["serde", "console", "verbose-logging"] }
solverforge-core = "0.19.4"
solverforge-ui = "0.6.5"
# Web server
axum = "0.8.9"
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
tower-http = { version = "0.6.10", features = ["fs", "cors"] }
tower = "0.5.3"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

# Utilities
uuid = { version = "1.23.1", features = ["v4", "serde"] }
parking_lot = "0.12.5"

[dev-dependencies]
toml = "1.1.2"

[profile.release]
opt-level = 3
lto = true
