[package]
name = "solverforge-furnace"
version = "2.0.0"
edition = "2021"
rust-version = "1.95"
description = "SolverForge heat-treatment furnace scheduling example"
license = "Apache-2.0"
publish = false

[[bin]]
name = "solverforge-furnace"
path = "src/main.rs"

[dependencies]
solverforge = { version = "0.19.4", features = [
  "serde",
  "console",
  "verbose-logging",
] }
solverforge-ui = "0.6.5"

axum = "0.8.9"
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
tower-http = { version = "0.6.10", features = ["fs", "cors"] }
tower = "0.5.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
parking_lot = "0.12.5"
rand = "0.10.1"

[dev-dependencies]
toml = "1.1.2"

[profile.release]
opt-level = 3
lto = true
