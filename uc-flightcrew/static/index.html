<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SolverForge Flight Crew</title>
  <link rel="stylesheet" href="/sf/sf.css">
  <link rel="stylesheet" href="/sf/vendor/fontawesome/css/fontawesome.min.css">
  <link rel="stylesheet" href="/sf/vendor/fontawesome/css/solid.min.css">
  <link rel="icon" href="/sf/img/ouroboros.svg" type="image/svg+xml">
  <style>
    body { background: radial-gradient(circle at 85% 0%, #e0f2fe 0, transparent 28rem), var(--sf-gray-50); }
    .flightcrew-panel { min-height: 66vh; }
    .flightcrew-panel > .sf-table-container { margin-bottom: var(--sf-space-5); }
    .flightcrew-error { padding: var(--sf-space-5); border: 1px solid var(--sf-red-600); border-radius: 12px; }
  </style>
</head>
<body>
  <div id="sf-app"></div>
  <script src="/sf/sf.js"></script>
  <script src="/flightcrew-model.js"></script>
  <script src="/app.js"></script>
</body>
</html>
