repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
        # solverforge-cli writes these files without a final newline on every
        # generate/destroy; keeping its bytes lets a CLI round trip leave a
        # clean git status.
        exclude: ^uc-[a-z]+/static/(generated/ui-model\.json|sf-config\.json)$
    -   id: trailing-whitespace
    -   id: check-merge-conflict
    -   id: check-added-large-files

-   repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.0
    hooks:
    -   id: gitleaks
-   repo: local
    hooks:
    -   id: solverforge-usecases-fmt-check
        name: Rust formatting across open-source use cases
        entry: make fmt-check
        language: system
        pass_filenames: false
        files: ^uc-(deliveries|fleet|flightcrew|fsr|furnace|hospital|lessons|orders)/(Cargo\.(toml|lock)|build\.rs|src/.*\.rs|tests/.*\.rs)$
    -   id: solverforge-usecases-clippy
        name: Clippy across open-source use cases
        entry: make clippy
        language: system
        pass_filenames: false
        files: ^uc-(deliveries|fleet|flightcrew|fsr|furnace|hospital|lessons|orders)/(Cargo\.(toml|lock)|build\.rs|src/.*\.rs|tests/.*\.rs)$
