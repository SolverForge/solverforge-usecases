[package]
name = "solverforge-furnace"
version = "3.0.2"
edition = "2021"
rust-version = "1.95"
description = "SolverForge heat-treatment furnace scheduling example"
license = "Apache-2.0"
publish = false

[[bin]]
name = "solverforge-furnace"
path = "src/main.rs"

[dependencies]
solverforge = { version = "0.25.0", features = [
  "serde",
  "console",
  "verbose-logging",
] }
solverforge-ui = "0.9.0"

axum = "0.8.9"
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
tower-http = { version = "0.6.10", features = ["fs", "cors"] }
tower = "0.5.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
parking_lot = "0.12.5"
rand = "0.10.1"

[dev-dependencies]
toml = "1.1.2"

# Debug info for this crate's test binary names every generic instantiation
# over the full constraint-set type; single names reach 7 MB and the strings
# total over 2.7 GB even with line tables only, which outgrows a hosted CI
# runner and nears the 4 GiB a DWARF32 link can address. Without debug info
# the symbol table still names every frame in a backtrace.
[profile.dev]
debug = false

[profile.release]
opt-level = 3
lto = true
