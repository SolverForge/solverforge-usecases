repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
    -   id: check-merge-conflict
    -   id: check-added-large-files

-   repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.0
    hooks:
    -   id: gitleaks
-   repo: local
    hooks:
    -   id: solverforge-usecases-fmt-check
        name: Rust formatting across open-source use cases
        entry: make fmt-check
        language: system
        pass_filenames: false
        files: ^uc-(deliveries|fsr|hospital|lessons)/(Cargo\.(toml|lock)|build\.rs|src/.*\.rs|tests/.*\.rs)$
    -   id: solverforge-usecases-clippy
        name: Clippy across open-source use cases
        entry: make clippy
        language: system
        pass_filenames: false
        files: ^uc-(deliveries|fsr|hospital|lessons)/(Cargo\.(toml|lock)|build\.rs|src/.*\.rs|tests/.*\.rs)$
