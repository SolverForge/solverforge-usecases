scalar_groups = []
conflict_repairs = []

[app]
name = "SolverForge Hospital"
starter = "neutral-shell"
shell = "web"
cli_version = "2.2.2"

[runtime]
target = "solverforge 0.24.0"
runtime_source = "crates.io: solverforge 0.24.0"
ui_source = "crates.io: solverforge-ui 0.9.0"

[demo]
default_size = "LARGE"
available_sizes = ["LARGE"]

[solution]
name = "Plan"
score = "HardSoftDecimalScore"
scalar_groups_path = ""
conflict_repairs_path = ""

[[facts]]
name = "employee"
plural = "employees"
kind = "problem_fact"

[[entities]]
name = "shift"
plural = "shifts"
kind = "planning_entity"

[[variables]]
entity = "shift"
entity_plural = "shifts"
field = "employee_idx"
kind = "scalar"
range = "employees"
elements = ""
allows_unassigned = true
candidate_values = "shift_employee_candidates"
nearby_value_candidates = "shift_nearby_employee_candidates"
nearby_entity_candidates = "shift_nearby_shift_candidates"
nearby_value_distance_meter = "shift_to_employee_nearby_distance"
nearby_entity_distance_meter = "shift_to_shift_nearby_distance"
enabled = true

[[constraints]]
name = "assigned_shift"
module = "assigned_shift"
enabled = true

[[constraints]]
name = "balance_assignments"
module = "balance_assignments"
enabled = true

[[constraints]]
name = "desired_day"
module = "desired_day"
enabled = true

[[constraints]]
name = "minimum_rest"
module = "minimum_rest"
enabled = true

[[constraints]]
name = "one_shift_per_day"
module = "one_shift_per_day"
enabled = true

[[constraints]]
name = "overlapping_shift"
module = "overlapping_shift"
enabled = true

[[constraints]]
name = "required_skill"
module = "required_skill"
enabled = true

[[constraints]]
name = "unavailable_employee"
module = "unavailable_employee"
enabled = true

[[constraints]]
name = "undesired_day"
module = "undesired_day"
enabled = true
