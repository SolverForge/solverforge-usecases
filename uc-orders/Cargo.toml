[package]
name = "solverforge-orders"
version = "0.1.1"
edition = "2021"
rust-version = "1.95"
description = "SolverForge warehouse order-picking optimizer"
license = "Apache-2.0"
publish = false

[[bin]]
name = "solverforge-orders"
path = "src/main.rs"

[dependencies]
solverforge = { version = "0.19.5", features = ["serde", "console", "verbose-logging"] }
solverforge-ui = { version = "0.9.0" }
# Web server
axum = "0.8.9"
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
tower-http = { version = "0.6.11", features = ["fs", "cors"] }
tower = "0.5.3"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
schemars = { version = "1.0", optional = true }

# Utilities
uuid = { version = "1.23.5", features = ["v4", "serde"] }
parking_lot = "0.12.5"

[features]
# Typed JSON Schemas for the shared DTO contract (required by the MCP shell).
schema = ["dep:schemars"]
